<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <meta name="theme-color" content="#000000" />
    <meta name="application-name" content="Olisiala" />
    <meta name="apple-mobile-web-app-title" content="Olisiala" />
    <link rel="manifest" href="./manifest.webmanifest" />
    
    <title>Olisiala</title>
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #000000;
        touch-action: manipulation;
        -webkit-tap-highlight-color: transparent;
      }

      body {
        display: grid;
        place-items: center;
      }

      #canvas {
        --project-screen-width: 16;
        --project-screen-height: 9;
        width: min(
          100vw,
          calc(
            var(--rvn-app-viewport-height, 100vh) *
              var(--project-screen-width) / var(--project-screen-height)
          )
        );
        aspect-ratio: var(--project-screen-width) / var(--project-screen-height);
        display: flex;
        align-items: center;
        justify-content: center;
        touch-action: manipulation;
      }

      #canvas canvas {
        width: 100% !important;
        height: 100% !important;
        display: block;
        touch-action: manipulation;
      }

      #loading {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        box-sizing: border-box;
        padding: 24px;
        color: #f2f2f2;
        background: #101010;
        font: 400 20px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        z-index: 10;
        user-select: none;
        transition: opacity 200ms ease, visibility 0s 200ms;
      }

      #loading.ready {
        cursor: pointer;
      }

      .loading-progress,
      #loading-start {
        grid-area: 1 / 1;
        transition: opacity 160ms ease, visibility 0s 160ms;
      }

      .loading-progress {
        width: min(220px, 66vw);
        animation: loading-appear 160ms ease-out;
      }

      #loading.ready .loading-progress {
        opacity: 0;
        visibility: hidden;
        animation: none;
      }

      #loading.ready #loading-start {
        opacity: 1;
        visibility: visible;
        transition-delay: 80ms;
      }

      @keyframes loading-appear {
        from { opacity: 0; }
        to { opacity: 1; }
      }

      .loading-labels {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        margin-bottom: 14px;
      }

      #loading-percentage {
        color: #d0d0d0;
        font-size: 18px;
        font-variant-numeric: tabular-nums;
      }

      #loading-progress {
        appearance: none;
        display: block;
        width: 100%;
        height: 2px;
        border: 0;
        background: #333;
        color: #eee;
      }

      #loading-progress::-webkit-progress-bar {
        background: #333;
      }

      #loading-progress::-webkit-progress-value {
        background: #eee;
        transition: width 150ms ease-out;
      }

      #loading-progress::-moz-progress-bar {
        background: #eee;
        transition: width 150ms ease-out;
      }

      #loading-start {
        opacity: 0;
        visibility: hidden;
        border: 0;
        padding: 12px 22px;
        min-height: 48px;
        background: transparent;
        color: inherit;
        font: inherit;
        letter-spacing: 0.01em;
        cursor: pointer;
      }

      #loading-start:hover {
        color: #fff;
      }

      #loading-start:focus-visible {
        outline: 1px solid #b8b8b8;
        outline-offset: 4px;
      }

      #loading.error {
        cursor: default;
        text-align: left;
        user-select: text;
      }

      #loading.hidden {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }

      @media (prefers-reduced-motion: reduce) {
        #loading,
        .loading-progress,
        #loading-start,
        #loading.ready #loading-start {
          animation: none;
          transition: none;
        }

        #loading-progress::-webkit-progress-value {
          transition: none;
        }

        #loading-progress::-moz-progress-bar {
          transition: none;
        }
      }

      #loading .loading-error {
        width: min(760px, calc(100vw - 32px));
      }

      #loading .loading-error-title {
        margin: 0 0 8px;
        font: 700 24px/1.2 sans-serif;
      }

      #loading .loading-error-summary {
        margin: 0 0 16px;
        color: #f1f5f9;
        font: 500 15px/1.45 sans-serif;
      }

      #loading .loading-error-details {
        box-sizing: border-box;
        width: 100%;
        max-height: min(58vh, 520px);
        margin: 0;
        overflow: auto;
        padding: 12px;
        border: 1px solid #334155;
        border-radius: 6px;
        background: #0f172a;
        color: #e2e8f0;
        font: 12px/1.45 ui-monospace, SFMono-Regular, Consolas, monospace;
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body data-player-start="click">
    <div id="loading">
      <div class="loading-progress">
        <div class="loading-labels">
          <span id="loading-label">Loading…</span>
          <span id="loading-percentage" aria-hidden="true">0%</span>
        </div>
        <progress id="loading-progress" max="100" value="0" aria-labelledby="loading-label"></progress>
      </div>
      <button id="loading-start" type="button" disabled>Click to start</button>
    </div>
    <div id="canvas"></div>
  </body>
  <script>
    (() => {
      const originalFetch = window.fetch.bind(window);
      const embeddedPackageChunkSize = 1024 * 1024;

      const getHeaderValue = (headers, name) => {
        if (!headers) {
          return "";
        }

        const normalizedName = name.toLowerCase();

        if (typeof headers.get === "function") {
          return headers.get(name) || headers.get(normalizedName) || "";
        }

        if (Array.isArray(headers)) {
          const entry = headers.find(
            ([key]) => String(key).toLowerCase() === normalizedName,
          );
          return entry?.[1] || "";
        }

        if (typeof headers === "object") {
          const entry = Object.entries(headers).find(
            ([key]) => String(key).toLowerCase() === normalizedName,
          );
          return entry?.[1] || "";
        }

        return "";
      };

      const getRangeHeader = (input, init) => {
        return (
          getHeaderValue(init?.headers, "range") ||
          getHeaderValue(input?.headers, "range")
        );
      };

      const parseRangeHeader = (rangeHeader, totalLength) => {
        if (!rangeHeader) {
          return undefined;
        }

        const match = /^bytes=(\d*)-(\d*)$/.exec(rangeHeader.trim());
        if (!match || totalLength === 0) {
          return { invalid: true };
        }

        let start;
        let end;

        if (match[1] === "") {
          const suffixLength = Number(match[2]);
          if (!Number.isFinite(suffixLength) || suffixLength <= 0) {
            return { invalid: true };
          }
          start = Math.max(totalLength - suffixLength, 0);
          end = totalLength - 1;
        } else {
          start = Number(match[1]);
          end = match[2] === "" ? totalLength - 1 : Number(match[2]);
        }

        if (
          !Number.isSafeInteger(start) ||
          !Number.isSafeInteger(end) ||
          start < 0 ||
          end < start ||
          start >= totalLength
        ) {
          return { invalid: true };
        }

        return {
          start,
          end: Math.min(end, totalLength - 1),
        };
      };

      const createEmbeddedPackageResponse = async ({ invoke, rangeHeader }) => {
        const info = await invoke("get_embedded_package_info");
        const totalLength = Number(info?.byteLength || 0);
        if (!rangeHeader) {
          return new Response(null, {
            status: 416,
            headers: {
              "accept-ranges": "bytes",
              "content-range": "bytes */" + totalLength,
            },
          });
        }

        const parsedRange = parseRangeHeader(rangeHeader, totalLength);

        if (parsedRange?.invalid) {
          return new Response(null, {
            status: 416,
            headers: {
              "accept-ranges": "bytes",
              "content-range": "bytes */" + totalLength,
            },
          });
        }

        const start = parsedRange?.start ?? 0;
        const end = parsedRange?.end ?? totalLength - 1;
        const contentLength = Math.max(end - start + 1, 0);
        let cursor = start;

        const stream = new ReadableStream({
          async pull(controller) {
            if (cursor > end || contentLength === 0) {
              controller.close();
              return;
            }

            const length = Math.min(
              embeddedPackageChunkSize,
              end - cursor + 1,
            );
            const bytes = await invoke("read_embedded_package_range", {
              offset: cursor,
              length,
            });
            const normalizedBytes =
              bytes instanceof Uint8Array ? bytes : new Uint8Array(bytes);

            if (normalizedBytes.byteLength === 0) {
              controller.close();
              return;
            }

            cursor += normalizedBytes.byteLength;
            controller.enqueue(normalizedBytes);
          },
        });

        const headers = {
          "accept-ranges": "bytes",
          "content-length": String(contentLength),
          "content-type": "application/octet-stream",
        };
        if (parsedRange) {
          headers["content-range"] =
            "bytes " + start + "-" + end + "/" + totalLength;
        }

        return new Response(stream, {
          status: parsedRange ? 206 : 200,
          headers,
        });
      };

      window.fetch = async (input, init) => {
        const rawUrl = typeof input === "string" ? input : input?.url;

        if (rawUrl) {
          try {
            const resolvedUrl = new URL(rawUrl, window.location.href);
            const invoke = window.__TAURI__?.core?.invoke;

            if (resolvedUrl.pathname.endsWith("/package.bin") && invoke) {
              try {
                return await createEmbeddedPackageResponse({
                  invoke,
                  rangeHeader: getRangeHeader(input, init),
                });
              } catch (error) {
                console.warn("Falling back to package.bin fetch.", error);
              }
            }
          } catch {}
        }

        return originalFetch(input, init);
      };

      // --- UNIVERSAL TOUCH & POINTER FORWARDER FOR ROUTEVN CANVAS ---
      const forwardTouchToCanvas = (e) => {
        const canvas = document.querySelector("canvas") || document.getElementById("canvas");
        if (!canvas) return;

        const touch = e.changedTouches[0];
        if (!touch) return;

        const commonProps = {
          clientX: touch.clientX,
          clientY: touch.clientY,
          screenX: touch.screenX,
          screenY: touch.screenY,
          pageX: touch.pageX,
          pageY: touch.pageY,
          bubbles: true,
          cancelable: true,
          composed: true,
          view: window,
          buttons: 1,
          button: 0,
          isPrimary: true,
          pointerId: 1,
          pointerType: "mouse"
        };

        if (e.type === "touchstart") {
          canvas.dispatchEvent(new PointerEvent("pointerdown", commonProps));
          canvas.dispatchEvent(new MouseEvent("mousedown", commonProps));
        } else if (e.type === "touchend") {
          canvas.dispatchEvent(new PointerEvent("pointerup", commonProps));
          canvas.dispatchEvent(new MouseEvent("mouseup", commonProps));
          canvas.dispatchEvent(new MouseEvent("click", commonProps));
        }
      };

      window.addEventListener("touchstart", forwardTouchToCanvas, { capture: true, passive: false });
      window.addEventListener("touchend", forwardTouchToCanvas, { capture: true, passive: false });
    })();
  </script>
  <script src="./main.js" type="module"></script>
</html>
